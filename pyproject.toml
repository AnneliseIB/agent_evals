[project]
name = "coding-agent-evals"
version = "0.1.0"
description = "A small Harbor workspace for developing a Python coding agent with OpenAI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "harbor==0.24.0",
    "openai>=2,<3",
]

[project.scripts]
openai-smoke = "coding_agent.smoke:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coding_agent"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
# Task verifiers depend on the sandbox filesystem and run through Harbor.
addopts = "--ignore=tasks --ignore=jobs"
