[project]
name = "comp590-evals"
version = "0.1.0"
description = "Harbor tasks and evaluation adapters for independently developed agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "harbor==0.24.0",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = [
    "pyright>=1.1,<2",
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_adapters"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
# Task verifiers depend on the sandbox filesystem and run through Harbor.
addopts = "--ignore=tasks --ignore=jobs"
