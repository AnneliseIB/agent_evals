# Run from the repository root. These are LearnWithAI's example deployment aliases;
# replace them if your UNC subscription exposes different aliases.
# Preview only: uv run --locked harbor run -c experiments/unc-model-comparison.yaml --print-config
# Actual evaluations require the student agent loop to be implemented first.
n_attempts: 1
n_concurrent_trials: 1
retry:
  max_retries: 0
environment:
  type: docker
tasks:
  - path: tasks/hello-python
agents:
  - import_path: coding_agent.agent:CodingAgent
    model_name: openai/gpt-5.6-luna
  - import_path: coding_agent.agent:CodingAgent
    model_name: openai/gpt-5.6-terra
