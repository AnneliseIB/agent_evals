# Run from evals/. Edit model names to match your agent's configured deployments.
# Preview: uv run --locked harbor run -c experiments/model-comparison.yaml --print-config
# The krisj_coding agent remains an unimplemented course scaffold.
n_attempts: 1
n_concurrent_trials: 1
retry:
  max_retries: 0
environment:
  type: docker
datasets:
  - path: tasks
agents:
  - import_path: eval_adapters.local:LocalCliAgent
    model_name: openai/gpt-5.6-luna
    kwargs:
      agent: krisj_coding
      package_path: ../590_agents
      env_file: ../590_agents/.env
  - import_path: eval_adapters.local:LocalCliAgent
    model_name: openai/gpt-5.6-terra
    kwargs:
      agent: krisj_coding
      package_path: ../590_agents
      env_file: ../590_agents/.env
